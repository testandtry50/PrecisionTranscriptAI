name: Build APK

# Put PrecisionTranscriptAI.zip (or the unzipped project) in the repository root together with this file.
# Everything else happens by itself: unzip, fetch Sherpa-ONNX, build, publish the APK.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unzips the .zip if that is what you uploaded)
        run: |
          set -e
          if [ -f app/build.gradle.kts ]; then
            ROOT="$PWD"
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::No project found. Upload PrecisionTranscriptAI.zip to the repository root."
              exit 1
            fi
            mkdir -p /tmp/proj
            unzip -q -o "$ZIP" -d /tmp/proj
            ROOT=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project folder: $ROOT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner already has the Android SDK. Just accept the licenses and make sure the needed pieces exist.
      - name: Android SDK pieces
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Sherpa-ONNX is not on Maven. Its Kotlin API and native libraries come from the same release tag.
      - name: Fetch Sherpa-ONNX
        run: |
          set -e
          TAG=$(gh release view --repo k2-fsa/sherpa-onnx --json tagName -q .tagName)
          echo "Using sherpa-onnx $TAG"
          mkdir -p /tmp/sherpa/rel
          cd /tmp/sherpa
          gh release download "$TAG" --repo k2-fsa/sherpa-onnx --pattern '*-android.tar.bz2'
          tar xjf ./sherpa-onnx-*-android.tar.bz2 -C /tmp/sherpa/rel
          echo "Release archive contents:"
          find /tmp/sherpa/rel -maxdepth 3 | head -30
          git clone --quiet --depth 1 --branch "$TAG" https://github.com/k2-fsa/sherpa-onnx src
          cd "$ROOT"
          KT=/tmp/sherpa/src/sherpa-onnx/kotlin-api
          [ -d "$KT" ] || KT=/tmp/sherpa/src/android/SherpaOnnx/app/src/main/java/com/k2fsa/sherpa/onnx
          # look ONLY inside the release archive (the source checkout has empty jniLibs folders of its own)
          LIBS=$(find /tmp/sherpa/rel -type d -name arm64-v8a | head -1)
          echo "Kotlin API from: $KT"
          echo "Native libs from: $LIBS"
          if [ -z "$LIBS" ] || ! ls "$LIBS"/*.so > /dev/null 2>&1; then
            echo "::error::No arm64-v8a .so files were found in the sherpa-onnx release archive"
            exit 1
          fi
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx app/src/main/jniLibs/arm64-v8a
          cp "$KT"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/
          cp "$LIBS"/*.so app/src/main/jniLibs/arm64-v8a/
          # The app uses ONNX Runtime from Maven (newest), so drop sherpa's duplicate copy.
          rm -f app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
          ls -la app/src/main/jniLibs/arm64-v8a
          ls app/src/main/java/com/k2fsa/sherpa/onnx | head -40

      - name: Build the APK
        id: build
        run: |
          set -o pipefail
          cd "$ROOT"
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Unit tests (these never block the APK)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cd "$ROOT"
          gradle testDebugUnitTest --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/test.log"

      - name: Put build errors in the run summary
        if: always() && steps.build.outcome == 'failure'
        run: |
          {
            echo "## Build failed - copy the box below and send it"
            echo '```'
            grep -E "^e: " "$GITHUB_WORKSPACE/build.log" | sed -E 's#file://##; s#/home/runner/work/[^/]+/[^/]+/##; s#/tmp/proj/##' | head -40 || true
            grep -A4 "What went wrong" "$GITHUB_WORKSPACE/build.log" | head -14 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Put failed tests in the run summary
        if: always() && steps.tests.outcome == 'failure'
        run: |
          {
            echo "## Some unit tests failed (the APK was still built)"
            echo '```'
            grep -E "FAILED|AssertionError|expected" "$GITHUB_WORKSPACE/test.log" | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect the APK
        run: |
          mkdir -p out
          cp "$ROOT"/app/build/outputs/apk/debug/*.apk out/PrecisionTranscriptAI-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: PrecisionTranscriptAI-APK
          path: out/PrecisionTranscriptAI-debug.apk

      - name: Publish as a release (easiest way to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          files: out/PrecisionTranscriptAI-debug.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: |
            build.log
            test.log
          if-no-files-found: ignore
